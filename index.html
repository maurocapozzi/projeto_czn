<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Descrição profissional do projeto CZN" />
    <title>CZN - Projeto Web</title>

    <!-- CSS Variables and Base Styles -->
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <!-- Cabeçalho Principal -->
    <header class="main-header">
      <nav class="main-nav">
        <a href="#" class="logo">CZN</a>
        <ul class="nav-links">
          <li><a href="#sobre">Sobre</a></li>
          <li><a href="#servicos">Serviços</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
      </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main id="main-content">
      <!-- Seção Hero -->
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">Bem-vindo ao CZN</h1>
        <p>Criando soluções web modernas e eficientes.</p>
        <a href="#contato" class="cta-button">Fale Conosco</a>
      </section>

      <!-- Seção de Serviços -->
      <section id="servicos" aria-labelledby="services-title">
        <h2 id="services-title">Nossos Serviços</h2>
        <div class="services-grid">
          <article class="service-card">
            <h3>Serviço 1</h3>
            <p>Descrição do serviço 1.</p>
          </article>
          <article class="service-card">
            <h3>Serviço 2</h3>
            <p>Descrição do serviço 2.</p>
          </article>
        </div>
      </section>
    </main>

    <!-- Rodapé -->
    <footer class="main-footer">
      <p>&copy; 2026 CZN. Todos os direitos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script src="src/js/main.js" type="module"></script>
  </body>
</html>
